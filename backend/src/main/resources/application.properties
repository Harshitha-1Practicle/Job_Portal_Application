spring.application.name=job-portal
spring.profiles.default=dev

# ── Database ──────────────────────────────────────────────────────────────────
# Defaults to H2 in-memory (zero-config local dev).
# Override all four env vars to switch to MySQL/PostgreSQL in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:jobportal;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:jobPortalSecretKeyForLocalDev1234567890ABCDEF}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
