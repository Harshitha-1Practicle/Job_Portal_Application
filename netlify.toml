[build]
base = "frontend"
command = "npm run build:netlify"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# Proxy /api/* → Render backend (set RENDER_BACKEND_URL in Netlify env vars)
[[redirects]]
from = "/api/*"
to = "https://job-portal-application-qc9v.onrender.com/api/:splat"
status = 200
force = true

# SPA fallback — must be last
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
